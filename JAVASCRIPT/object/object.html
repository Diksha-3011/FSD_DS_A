<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body><script>


//create object 
const car={
    name:"BMW",
    model:"M5",
    color:"black",
    seats:5
};
document.write(car.name+"<br>"+car.model+"<br>"+car.color+"<br>"+car.seats+"<br>");
console.log(car);
document.write(car);


for(let key in car){
    document.write("<br>"+key+":"+car[key]);

}

document.write("<br>"+Object.values(car));
</script>
    
</body>
</html>
